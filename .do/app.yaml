name: glimmora-pharma
region: blr

# ── Pre-deploy migration (Prisma) ─────────────────────────────────────────────
jobs:
  - name: migrate
    kind: PRE_DEPLOY
    github:
      repo: baarez-technology/Glimmora-Pharma
      branch: main
      deploy_on_push: true
    source_dir: /
    build_command: NODE_OPTIONS="--max-old-space-size=1024" npm ci && npx prisma generate
    # DO NOT use `prisma db push` here: this Neon DB is shared with the FastAPI
    # backend (SQLAlchemy owns snake_case tables `tenants`, `users`, …). db push
    # reconciles the WHOLE database to schema.prisma and would DROP those backend
    # tables. Only `migrate deploy` (which touches just the migrations' own
    # statements) is safe. The migrations lineage must be valid PostgreSQL.
    run_command: npx prisma migrate deploy
    instance_size_slug: basic-xs
    envs:
      - key: DATABASE_URL
        scope: RUN_AND_BUILD_TIME
        type: SECRET
      - key: NPM_CONFIG_PRODUCTION
        scope: BUILD_TIME
        value: "false"

services:
  # ── FastAPI AI backend ────────────────────────────────────────────────────
  # Deployed from its OWN repo, not from a copy vendored into this one. The
  # former `source_dir: /backend` snapshot drifted months behind `ai_develop`
  # (it carried 12 of 24 routers and none of the help/draft/search/summary
  # services), so every newer AI endpoint 404'd in production while working
  # locally. Never re-vendor this code — point at the source of truth.
  - name: api
    github:
      repo: baarez-technology/pharma_glimmora_ai_backend
      branch: ai_develop
      deploy_on_push: true
    source_dir: /
    environment_slug: python
    build_command: pip install -r requirements.txt
    run_command: uvicorn app.main:app --host 0.0.0.0 --port 8080 --log-level info
    http_port: 8080
    instance_size_slug: basic-xs
    instance_count: 1
    # `preserve_path_prefix` is REQUIRED. Without it DO strips the matched
    # prefix before forwarding, so `/api/v1/auth/login` reaches FastAPI as
    # `/auth/login` and 404s even though the route exists. (Observable proof:
    # GET /v1 returned the body of `@app.get("/")`, GET /api/ai/health returned
    # the body of `@app.get("/health")` — both root-level routes.)
    routes:
      - path: /v1
        preserve_path_prefix: true
      - path: /api/ai
        preserve_path_prefix: true
      - path: /api/v1
        preserve_path_prefix: true
    health_check:
      http_path: /health
      initial_delay_seconds: 30
      period_seconds: 30
      timeout_seconds: 10
      failure_threshold: 5
    envs:
      - key: DATABASE_URL
        scope: RUN_AND_BUILD_TIME
        type: SECRET
      - key: OPENAI_API_KEY
        scope: RUN_AND_BUILD_TIME
        type: SECRET
      - key: PINECONE_API_KEY
        scope: RUN_AND_BUILD_TIME
        type: SECRET
      # The backend reads SECRET_KEY (app/routers/auth_router.py), not
      # JWT_SECRET — under the old name it silently fell back to the insecure
      # hardcoded dev key that signs every JWT.
      - key: SECRET_KEY
        scope: RUN_AND_BUILD_TIME
        type: SECRET
      # Production is auto-detected via RENDER / ENV / ENVIRONMENT. On DO none
      # of those were set, so the backend believed it was in development:
      # SECRET_KEY was optional and token verification was fail-open (a bad or
      # missing `auth` header was allowed through instead of 401).
      - key: ENV
        scope: RUN_AND_BUILD_TIME
        value: production
      # Consumed by the CORS middleware in app/main.py (comma-separated).
      # ${APP_URL} resolves to the app's own public URL.
      - key: ALLOWED_ORIGINS
        scope: RUN_AND_BUILD_TIME
        value: ${APP_URL}

  # ── Next.js frontend ──────────────────────────────────────────────────────
  - name: web
    github:
      repo: baarez-technology/Glimmora-Pharma
      branch: main
      deploy_on_push: true
    source_dir: /
    build_command: npm ci && npx prisma generate && NODE_OPTIONS="--max-old-space-size=2048" npm run build
    run_command: npm start
    http_port: 3000
    instance_size_slug: basic-s
    instance_count: 1
    routes:
      - path: /
    health_check:
      http_path: /api/auth/session
      initial_delay_seconds: 10
      period_seconds: 30
      timeout_seconds: 5
      failure_threshold: 3
    envs:
      # ── Prisma / PostgreSQL ────────────────────────────────────────────
      - key: DATABASE_URL
        scope: RUN_AND_BUILD_TIME
        type: SECRET

      # ── NextAuth ───────────────────────────────────────────────────────
      - key: NEXTAUTH_SECRET
        scope: RUN_AND_BUILD_TIME
        type: SECRET
      - key: NEXTAUTH_URL
        scope: RUN_AND_BUILD_TIME
        type: SECRET

      # ── Email / SMTP ───────────────────────────────────────────────────
      - key: GMAIL_USER
        scope: RUN_AND_BUILD_TIME
        type: SECRET
      - key: GMAIL_APP_PASSWORD
        scope: RUN_AND_BUILD_TIME
        type: SECRET

      # ── AI backend (internal DO private URL) ──────────────────────────
      # ${api.PRIVATE_URL} resolves to the api service's internal hostname.
      # Next.js server → FastAPI never leaves DO's private network.
      - key: BACKEND_URL
        scope: RUN_AND_BUILD_TIME
        value: ${api.PRIVATE_URL}

      # ── AI access token signing ────────────────────────────────────────
      # The web service is the AI service's Backend-For-Frontend: it
      # authenticates the user (NextAuth) and then mints the short-lived HS256
      # token the AI service verifies (src/lib/aiToken.server.ts →
      # app/routers/auth_router.py). Browsers no longer hold an AI credential
      # at all, so this MUST match the api service's SECRET_KEY above.
      #
      # NOT NEXT_PUBLIC_ — a public copy would put the signing key in the
      # browser bundle and let anyone forge a token for any tenant.
      #
      # If unset, the proxy sends no auth header: the api service runs with
      # ENV=production above, so every AI call answers 401. That is the
      # intended visible failure, not a silent degradation.
      - key: AI_JWT_SECRET
        scope: RUN_AND_BUILD_TIME
        type: SECRET

      # ── Build optimization ─────────────────────────────────────────────
      # Prevent npm from pruning devDependencies during buildpack phase
      # TypeScript and build tools are needed during custom build_command
      - key: NPM_CONFIG_PRODUCTION
        scope: BUILD_TIME
        value: "false"

      # Disable Turbopack for production builds (experimental, memory-heavy)
      - key: TURBOPACK
        scope: BUILD_TIME
        value: "0"

      # ── File storage (DO Spaces) ───────────────────────────────────────
      - key: FILE_STORAGE_BACKEND
        scope: RUN_AND_BUILD_TIME
        value: do-spaces
      - key: DO_SPACES_ENDPOINT
        scope: RUN_AND_BUILD_TIME
        type: SECRET
      - key: DO_SPACES_KEY
        scope: RUN_AND_BUILD_TIME
        type: SECRET
      - key: DO_SPACES_SECRET
        scope: RUN_AND_BUILD_TIME
        type: SECRET
      - key: DO_SPACES_BUCKET
        scope: RUN_AND_BUILD_TIME
        type: SECRET
      - key: DO_SPACES_REGION
        scope: RUN_AND_BUILD_TIME
        value: blr1
